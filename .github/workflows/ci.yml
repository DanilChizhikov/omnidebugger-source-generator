name: CI

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DTech.OmniDebugger.SourceGenerator.Tests -c Release

      - name: Build
        run: dotnet build src/DTech.OmniDebugger.SourceGenerator -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: DTech.OmniDebugger.SourceGenerator
          path: src/DTech.OmniDebugger.SourceGenerator/bin/Release/netstandard2.0/DTech.OmniDebugger.SourceGenerator.dll
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/DTech.OmniDebugger.SourceGenerator/bin/Release/netstandard2.0/DTech.OmniDebugger.SourceGenerator.dll
