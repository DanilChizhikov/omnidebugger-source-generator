name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/DTech.OmniDebugger.SourceGenerator.Tests -c Release

      - name: Build generator
        run: dotnet build src/DTech.OmniDebugger.SourceGenerator -c Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DTech.OmniDebugger.SourceGenerator
          path: src/DTech.OmniDebugger.SourceGenerator/bin/Release/netstandard2.0/DTech.OmniDebugger.SourceGenerator.dll
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/DTech.OmniDebugger.SourceGenerator/bin/Release/netstandard2.0/DTech.OmniDebugger.SourceGenerator.dll
