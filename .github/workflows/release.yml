name: Release

# A pull request from release/X.Y.Z or hotfix/X.Y.Z into master is a release. While it is open, `validate` checks it is
# ready; once it is merged, `release` builds the generator from the merge commit and publishes vX.Y.Z with the pull
# request's description as the release notes and the DLL attached.
on:
  pull_request:
    types: [ opened, edited, synchronize, reopened, closed ]
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.number }}

jobs:
  validate:
    name: Validate Release
    if: >
      github.event.action != 'closed' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check version, changelog and notes
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .github/scripts/release-version.sh

  release:
    name: Build and Release
    if: >
      github.event.action == 'closed' && github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest

    env:
      DLL: src/DTech.OmniDebugger.SourceGenerator/bin/Release/netstandard2.0/DTech.OmniDebugger.SourceGenerator.dll

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - name: Check version, changelog and notes
        id: version
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh .github/scripts/release-version.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/DTech.OmniDebugger.SourceGenerator.Tests -c Release

      - name: Build generator
        run: dotnet build src/DTech.OmniDebugger.SourceGenerator -c Release

      - name: Check DLL version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $built = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $env:DLL)).Version.ToString(3)
          Write-Host "DLL version: $built"
          if ($built -ne $env:VERSION) {
            Write-Host "::error::The built DLL is $built, the release is $env:VERSION."
            exit 1
          }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: DTech.OmniDebugger.SourceGenerator-${{ steps.version.outputs.version }}
          path: ${{ env.DLL }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body: ${{ github.event.pull_request.body }}
          files: ${{ env.DLL }}
          fail_on_unmatched_files: true
          make_latest: true
